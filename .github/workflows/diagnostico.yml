name: diagnostico
on:
  push:
    paths: ['.github/workflows/diagnostico.yml']
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Probar hoja de Google
        run: |
          U='https://script.google.com/macros/s/AKfycbyTPCMZJNoPpPuqtEcOKvqQNtjIFCldy9ywOL2QkpzZ-pGPQXZW5ZNeDzemBhpOAuvv/exec'
          F=$(TZ=America/Lima date -d '+2 day' +%F)
          echo "== GET =="; curl -sL "$U" | head -c 600; echo
          echo "== HORARIOS $F =="; curl -sL -H 'Content-Type: text/plain' -d "{\"action\":\"horarios\",\"servicio\":\"Cejas\",\"profesional\":\"Viviana\",\"fecha\":\"$F\"}" "$U" | head -c 600; echo
