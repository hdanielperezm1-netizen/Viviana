name: diagnostico
on:
  push:
    paths: ['.github/workflows/diagnostico.yml']
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Medir tiempos
        run: |
          U='https://script.google.com/macros/s/AKfycbzB_Av1mrfCoiICNl2V4ECLMFsXEa9Brf0HHGZSsNQT2EGq0F6LM1m3BuDlp78BV3eY/exec'
          F=$(TZ=America/Lima date -d '+2 day' +%F)
          for i in 1 2 3; do
            T1=$(curl -sL -o /dev/null -w '%{time_total}' "$U")
            T2=$(curl -sL -o /dev/null -w '%{time_total}' -H 'Content-Type: text/plain' -d "{\"action\":\"horarios\",\"servicio\":\"Barbería\",\"profesional\":\"Leo\",\"fecha\":\"$F\"}" "$U")
            echo "::notice title=Ronda $i::GET ${T1}s · horarios ${T2}s"
          done
